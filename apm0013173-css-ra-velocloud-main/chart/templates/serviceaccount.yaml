{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "css-ra-velocloud.serviceAccountName" . }}
  labels:
    {{- include "css-ra-velocloud.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.serviceAccount.annotations }}
  {{- if .Values.secretsStore.enabled }}
  {{- $_ := set $annotations "azure.workload.identity/client-id" .Values.secretsStore.clientId }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  namespace: {{ .Values.namespace }}
{{- end }}
