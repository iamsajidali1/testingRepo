{{- if .Values.secretsStore.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "css-ra-velocloud.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "css-ra-velocloud.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.secretsStore.clientId | quote }}
    keyvaultName: {{ .Values.secretsStore.keyVaultName | quote }}
    tenantId: {{ .Values.secretsStore.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretsStore.objects }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secretsStore.kubernetesSecretName }}
      type: Opaque
      data:
        {{- range .Values.secretsStore.objects }}
        - objectName: {{ .objectName }}
          key: {{ .objectAlias }}
        {{- end }}
{{- end }}
