apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "css-ra-velocloud.fullname" . }}
  labels:
    {{- include "css-ra-velocloud.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "css-ra-velocloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "css-ra-velocloud.selectorLabels" . | nindent 8 }}
        {{- if .Values.secretsStore.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "css-ra-velocloud.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.image.fullReference | default (printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.secretsStore.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretsStore.kubernetesSecretName }}
          {{- end }}
          command: ["/app/venv/bin/gunicorn"]
          args:
            - "--bind"
            - "0.0.0.0:8000"
            - "--workers"
            - "2"
            - "--worker-class"
            - "uvicorn_worker.UvicornWorker"
            - "--timeout"
            - "10000"
            - "--access-logfile"
            - "-"
            - "--error-logfile"
            - "-"
            - "velocloud_app.asgi:application"
          env:
            {{- range concat .Values.image.env .Values.image.extraEnv }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: http
              containerPort: {{ .Values.image.containerPort }}
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: {{ .Values.livenessProbePath }}
          #     port: http
          # readinessProbe:
          #   httpGet:
          #     path: {{ .Values.readinessProbePath }}
          #     port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.secretsStore.enabled }}
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            {{- end }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.secretsStore.enabled }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "css-ra-velocloud.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
