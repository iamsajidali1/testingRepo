#+--------------------+
#|    Build           |
#+--------------------+
build:
  project-dir: '.'
  install_dependencies: pip install -r requirements-dev.txt
#+--------------------+
#|    Sonar           |------------------------------------------------------------------------------------------------
#+--------------------+
sonar:
  property: sonar-project.properties

  properties:
    sonar-debug: 'true'
    sonar-verbose: 'true'
    sonar-inclusions: 'api/**/*.py,velocloud_app/**/*.py'
    sonar-exclusions: '**/__pycache__/**,**/*.pyc,api/tests/**,**/tests.py,**/migrations/**,**/static/**,**/__init__.py'
    sonar-tests: 'api/tests'
    sonar-python-coverage-reportPaths: 'coverage.xml'
    sonar-qualitygate-wait: 'false' # The separate RevUp Quality Gate still enforces the analysis results.
  ## Any other Sonar Analysis property keys can be added here
  ## Refer to `https://docs.sonarqube.org/latest/analysis/analysis-parameters/`
  additional-properties: >
    -Dsonar.log_level='INFO'
  domain: com.att.one
  name: css-ra-velocloud

#+--------------------+
#|    SAST            |-----------------------------------------------------------------------------------------------
#+--------------------+
veracode-sast:

  ## Code main language
  language-type: 'python'

  ## File types to be scanned
  file-type-for-scan: "./api,./velocloud_app"

  ## Maximum time (in minutes) to wait for Veracode scan completion.
  ## Default: 120. Valid range: 1–359.
  ## IMPORTANT: If increasing this value, also set 'timeout-minutes' on the
  ## veracode-sast job in your workflow to a value >= this setting.
  # scan-timeout-minutes: 120

  ## VeraCode properties
  properties:
    ## The application name in Veracode
    ## In case of MonoRepo project, please comment it
    ## Veracode Profile Name should be as follow:
    ## <mots-id>-<project-acronym>-<service-name>
    profile-name: '<profile name>'
    sandbox-name: ''
    create-sandbox: null
    ## The criticality of the application
    ## Valid values: VeryHigh, High, Medium, Low, VeryLow
    ## Default: 'VeryHigh'
    # criticality: 'VeryHigh'

    ## Create a sandbox if not exists in Veracode
    ## Default: false
    # create-sandbox: true

    ## The sandbox name if create-sandbox is set to true
    ## Relevant only for Poly Repo project
    ## Default: 'Default-Sandbox'
    # sandbox-name: <sandbox name>

    ## The debug mode
    ## Default: false
    # debug: true


    #+--------------------+
    #|  Veracode Pipeline |-----------------------------------------------------------------------------------------------
    #|        Scan        |-----------------------------------------------------------------------------------------------
    #+--------------------+

    ## Pipeline scan uses variables from veracode-sast, in addition to below which can be used to reduce false positives
    #veracode-pipeline-scan:
    #timeout: 60
    ## Wildcards can be used, for example: **/node_modules/**,coverage/**,dist/**
    #file-types-to-exclude: ''
    #max-retries: 5


    #+--------------------+
    #|    SCA             |-----------------------------------------------------------------------------------------------
    #+--------------------+
veracode-sca:

  ## VeraCode SCA, Agent Based Scan,  workspace name
  ## Usually its WS-<motsid>
  workspace-name: 'WS-29786'
  ## VeraCode SCA, Agent Based Scan, Project name
  ## Each Workspace can have multiple projects
  ## Set it to get customized name.
  ## Relevant only for Poly Repo project
  # name: '< Project Name >'

  ## Enable SCA upload on PR events (default behavior is no upload on PR)
  # upload-on-pr: 'true'




  #+--------------------+
  #|    Quality Gate    |------------------------------------------------------------------------------------------------
  #+--------------------+
qualitygate:
  java-full-path: "/usr/bin/java"
  project-path: "."
  continues-improvement: 'false'

#+--------------------+
#|    Tests           |------------------------------------------------------------------------------------------------
#+--------------------+
tests:
  package-name: '<package name>'
  pythonpath: 'api'
  pytest:
    enable: 'true'
    target: 'api/tests'
    result-file: 'junit/test-results.xml'
  lint:
    enable: 'true'
    tool: 'flake8'
    command: 'flake8 api velocloud_app manage.py gunicorn.py --max-line-length=120 --ignore=E203,W503,E501 --count --select=E9,F63,F7,F82 --show-source --statistics'
  tox:
    enable: 'false'

#+--------------------+
#|    Docker          |------------------------------------------------------------------------------------------------
#+--------------------+
docker:
  dockerfile: 'Dockerfile'
  build-path: '.'

#+--------------------+
#|    Deployment      |------------------------------------------------------------------------------------------------
#+--------------------+
deployment:
  workflow-id: 'cd.yaml'
