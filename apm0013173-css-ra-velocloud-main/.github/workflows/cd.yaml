name: 'css-ra-velocloud CD - AKS'
run-name: "CD - Azure AKS, from CI Build: ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to Deploy'
        default: '1.0.0'
        required: true
        type: string

      authentication:
        description: 'Authentication ID'
        default: 'undef'
        required: true
        type: string

      invoked_by:
        description: 'Invoked by'
        default: 'undef'
        required: false
        type: string

      run_id:
        description: 'Run ID'
        default: ''
        required: false
        type: string

      dora_unique_id:
        description: 'Dora Unique ID for correlation'
        default: ''
        required: false
        type: string

      ############################################

      dev:
        description: 'Deploy to Dev'
        default: true
        required: false
        type: boolean

      prod:
        description: 'Deploy to Prod'
        default: false
        required: false
        type: boolean

permissions:
  id-token: write
  contents: read
  attestations: read

env:
  revup_iebus_secret: ${{ secrets.REVUP_EVENTING_SECRET }} # Used by RevUp Actions for Sending Event Data.

jobs:

  #+--------------------+
  #|  Info              |
  #+--------------------+

  info:
    name: Information
    runs-on:
      group: 'apm0013173-runner-group-primary'
      labels:
        - apm0013173-runner-group-primary
        - 38687e5c-12eb-4338-a30e-c2d84ba9c2f5
    steps:
      - name: Echo Deploy Information
        env:
          VERSION: ${{ inputs.version }}
          INVOKED_BY: ${{ inputs.invoked_by }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          printf "[INFO] Triggered by workflow: %s\n" "${INVOKED_BY} - ${VERSION}"
          printf "[INFO] Link To Running Workflow: https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}\n"

  #+--------------------+
  #|  Env:    Dev       |
  #+--------------------+
  dev:
    name: Deploy - dev
    if: ${{ inputs.dev }}
    runs-on:
      group: 'apm0013173-runner-group-primary'
      labels:
        - apm0013173-runner-group-primary
        - 38687e5c-12eb-4338-a30e-c2d84ba9c2f5
    environment: dev # This environment needs to match the case-sensitive GitHub environment name defined in DHP.
    env:
      AUTHENTICATION: ${{ inputs.authentication }}
      EXPECTED_AUTHENTICATION: ${{ secrets.AUTHENTICATION_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Authentication ID
        shell: bash
        run: |
          [ "${AUTHENTICATION}" = "${EXPECTED_AUTHENTICATION}" ] \
          && echo "AUTHENTICATION ID matches. Proceeding with deployment" \
          || { echo "AUTHENTICATION ID does not match. Aborting deployment"; exit 1; }

      - name: 'Pre-Deployment'
        shell: bash
        run: |
          printf "Deploying to %s\n" "${{ env.ENV }}"
          echo "::notice::Dev ${VERSION} deployed on $(date)"

      - name: Run Flyway
        if: ${{ env.yaml_flyway_db-host }}
        uses: ATT-IDP/revup-flyway@v3
        with:
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          environment: 'dev' # This environment needs to match the case sensitive environment defined in configuration.yaml

      - name: 'AKS - Dev'
        uses: ATT-IDP/revup-deployment-aks@v3
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          environment: 'dev' # refers  to the filename under <charts>/envs/<env>.yaml (should also match configuration.yaml environment)
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
          version: ${{ inputs.version }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: 'Dora Notification'
        uses: ATT-IDP/revup-teamup-dora@v3
        with:
          version: ${{ inputs.version }}
          report_type: 'deploy'
          environment_name: 'dev'
          dora_unique_id: ${{ inputs.dora_unique_id }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}

  #+--------------------+
  #|  Env:    Prod      |
  #+--------------------+
  prod:
    name: Deploy - Prod
    if: ${{ always() && inputs.prod && (needs.dev.result == 'success' || needs.dev.result == 'skipped') }}
    runs-on:
      group: 'apm0013173-runner-group-primary'
      labels:
        - apm0013173-runner-group-primary
        - 38687e5c-12eb-4338-a30e-c2d84ba9c2f5
    needs: [ dev ]
    environment: prod # This environment needs to match the case-sensitive GitHub environment name defined in DHP.
    env:
      AUTHENTICATION: ${{ inputs.authentication }}
      EXPECTED_AUTHENTICATION: ${{ secrets.AUTHENTICATION_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Authentication ID
        shell: bash
        run: |
          [ "${AUTHENTICATION}" = "${EXPECTED_AUTHENTICATION}" ] \
          && echo "AUTHENTICATION ID matches. Proceeding with deployment" \
          || { echo "AUTHENTICATION ID does not match. Aborting deployment"; exit 1; }

      - name: 'Pre-Deployment'
        shell: bash
        run: |
          printf "Deploying to %s\n" "${{ env.ENV }}"
          echo "::notice::Prod ${VERSION} deployment started on $(date)"

      - name: Validate production deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          prod_config=".github/variables/prod/cd_vars.yaml"
          prod_values="chart/envs/prod.yaml"

          require_file() {
            local file="$1"
            test -f "${file}" || { echo "Required deployment file not found: ${file}" >&2; exit 1; }
          }

          require_line() {
            local expected="$1"
            local file="$2"
            grep -Fq "${expected}" "${file}" || { echo "Missing expected line in ${file}: ${expected}" >&2; exit 1; }
          }

          require_file "${prod_config}"
          require_file "${prod_values}"

          require_line "artifacts-server: 'https://artifact-gold.it.att.com'" "${prod_config}"
          require_line "repository: 'apm0013173-dkr-bok-gold'" "${prod_config}"
          require_line "repository: 'apm0013173-hlm-gold'" "${prod_config}"
          require_line "subscription-id: 'b9a346d2-c8ed-4ee7-b23a-021b28e2b0ca'" "${prod_config}"
          require_line "resource-group: 'one-eastus2-prod-infr-rg'" "${prod_config}"
          require_line "cluster-name: 'eastus2-one-prod-aks'" "${prod_config}"
          require_line "release-name: 'css-ra-velocloud-prod'" "${prod_config}"

          require_line 'keyVaultName: eastus2-one-prodkv' "${prod_values}"
          require_line 'host: selfservice.web.att.com' "${prod_values}"
          require_line 'secretName: selfservice-web-tls-certificate' "${prod_values}"

          if grep -Eq 'artifact\.it\.att\.com|:22609|dkr-bok-stage|hlm-stage|one-eastus2-nprd-infr-rg|eastus2-one-nprd-aks|eastus2-one-nprdkv' \
            "${prod_config}" "${prod_values}"; then
            echo "NPRD or staging configuration found in PROD deployment inputs" >&2
            exit 1
          fi

      - name: Run Flyway
        if: ${{ env.yaml_flyway_db-host }}
        uses: ATT-IDP/revup-flyway@v3
        with:
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          environment: 'prod' # This environment needs to match the case sensitive environment defined in configuration.yaml

      - name: 'AKS - Prod'
        uses: ATT-IDP/revup-deployment-aks@v3
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          environment: 'prod' # refers  to the filename under <charts>/envs/<env>.yaml (should also match configuration.yaml environment)
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          jfrog_username: ${{ secrets.JFROG_USERNAME }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
          version: ${{ inputs.version }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: 'Dora Notification'
        uses: ATT-IDP/revup-teamup-dora@v3
        with:
          version: ${{ inputs.version }}
          report_type: 'deploy'
          environment_name: 'prod'
          dora_unique_id: ${{ inputs.dora_unique_id }}
          app_id: ${{ secrets.GH_REVUP_APP_ID }}
          app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
