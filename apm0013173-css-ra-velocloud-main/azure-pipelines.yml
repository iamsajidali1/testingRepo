variables:
  imageName: css-ra-velocloud
  serviceName: css-ra-velocloud
  namespace: com-att-one
  vmssPool: 29786-ONE-DevOps-eastus2-AgentPool
  acrName: oneeastus2cr2azn0hvf

  # service connection names
  imageRegistry: ONEAzureACR-NPRD
  imageRegistryPull: JFrog
  nprdServiceConnection: 29786-ONE-NPRD-ServiceConnection-WIF
  prodServiceConnection: 29786-ONE-PROD-ServiceConnection-WIF

  devAzEnv: nprd
  prodAzEnv: prod

  devResourceGroup: one-eastus2-nprd-infr-rg
  prodResourceGroup: one-eastus2-prod-infr-rg

  devCluster: eastus2-one-nprd-aks
  prodCluster: eastus2-one-prod-aks

  devopsKeyvault: dev-29786-eastus2-kv0

trigger:
  - azure/dev
  - azure/prod

# No PR Trigger
pr: none

jobs:
  - job: prereq
    pool:
      name: ${{ variables.vmssPool }}

    steps:
      - bash: |
          set -xe
          sudo apt-get update && sudo apt-get install --only-upgrade -y azure-cli
        displayName: Update packages
      - task: DockerInstaller@0
        displayName: Docker installer
        inputs:
          dockerVersion: 17.09.0-ce
          releaseType: stable
      - bash: |
          set -xe
          for item in $(sudo lsof /var/lib/dpkg/lock|awk '{print $2}'|sed -e 1d)
          do
              sudo kill -9 $item
          done
          sudo rm /var/lib/dpkg/lock ||true
          sudo rm /var/lib/dpkg/lock-frontend ||true
          sudo dpkg --configure -a
          sudo apt-get install -y unzip
        displayName: Install unzip for Helm installer

  - job: build
    dependsOn: prereq
    pool:
      name: ${{ variables.vmssPool }}

    steps:
      # dead on a fresh instance ?
      - bash: |
          set -xe
          which docker
          sudo service docker status
          sudo service docker restart
          sudo service docker status
        displayName: Restart docker daemon

      - bash: |
          set -xe
          sudo mkdir -p /etc/systemd/system/docker.service.d
          echo '[Service]' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
          echo 'Environment="HTTP_PROXY=http://proxy.conexus.svc.local:3128"' | sudo tee -a /etc/systemd/system/docker.service.d/http-proxy.conf
          echo 'Environment="HTTPS_PROXY=http://proxy.conexus.svc.local:3128"' | sudo tee -a /etc/systemd/system/docker.service.d/http-proxy.conf
          echo 'Environment="NO_PROXY=localhost,127.0.0.1,.azurecr.io,.azure.com,.blob.core.windows.net"' | sudo tee -a /etc/systemd/system/docker.service.d/http-proxy.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          sudo systemctl show --property=Environment docker | sed 's/\(HTTP_PROXY\|HTTPS_PROXY\)=[^ ]*/\1=***MASKED***/g'
        displayName: Configure docker daemon proxy settings

      - bash: |
          set -xe
          getent hosts artifact.it.att.com || true
          nslookup artifact.it.att.com || true
          curl -vkI --connect-timeout 20 https://artifact.it.att.com/v2/ || true
          HTTPS_PROXY=http://proxy.conexus.svc.local:3128 curl -vkI --connect-timeout 20 https://artifact.it.att.com/v2/ || true
        displayName: Check JFrog reachability
      
      - bash: |
          echo "##vso[task.setvariable variable=GitHash;isoutput=true]$(git rev-parse --short HEAD)"
        name: BuildVars
        displayName: Setting build variables

      - task: Docker@2
        displayName: Login to JFrog
        inputs:
          command: login
          containerRegistry: ${{ variables.imageRegistryPull }}

      - task: AzureKeyVault@2
        displayName: Get build secrets from KeyVault
        inputs:
          azureSubscription: ${{ variables.nprdServiceConnection }}
          KeyVaultName: ${{ variables.devopsKeyvault }}
          SecretsFilter: 'jfrog-username,jfrog-token'

      - task: Docker@2
        displayName: Build image
        env:
          JFROG_USERNAME: $(jfrog-username)
          JFROG_TOKEN: $(jfrog-token)
        inputs:
          command: build
          repository: ${{ variables.imageName }}
          containerRegistry: ${{ variables.imageRegistry }}
          tags: $(Build.SourceBranchName)-$(BuildVars.GitHash)
          arguments:
            --build-arg ENV=$(Build.SourceBranchName)
            --build-arg HTTP_PROXY=$(http_proxy)
            --build-arg HTTPS_PROXY=$(http_proxy)
            --build-arg NO_PROXY=.extensions.svc,.vault.azure.net,10.0.0.0/8,.svc.cluster.local,.azurecr.io,.azure.com
            --secret id=jfrog_username,env=JFROG_USERNAME
            --secret id=jfrog_access_token,env=JFROG_TOKEN

      - bash: echo "No Test Suits to Execute!"
        displayName: Run test suite
      
      - task: Docker@2
        displayName: Login to ACR
        inputs:
          command: login
          containerRegistry: ${{ variables.imageRegistry }}

      - task: Docker@2
        displayName: Push image
        inputs:
          command: push
          repository: ${{ variables.imageName }}
          containerRegistry: ${{ variables.imageRegistry }}
          tags: $(Build.SourceBranchName)-$(BuildVars.GitHash)

      - task: Docker@2
        displayName: Logout of ACR
        inputs:
          command: logout
          containerRegistry: ${{ variables.imageRegistry }}
      
      - task: Docker@2
        displayName: Logout of JFrog
        inputs:
          command: logout
          containerRegistry: ${{ variables.imageRegistryPull }}
          
  - job: deploy
    dependsOn: build
    variables:
      buildHash: $[ dependencies.build.outputs['BuildVars.GitHash'] ]
    pool:
      name: ${{ variables.vmssPool }}

    steps:
      - checkout: self
        submodules: true

      - task: HelmInstaller@1
        displayName: Helm installer
        inputs:
          helmVersionToInstall: latest

      - task: KubeloginInstaller@0
        displayName: Kubelogin installer
        inputs:
          kubeloginVersion: 'latest'

      - bash: az --version
        displayName: 'Show Azure CLI version'

      - task: AzureCLI@2
        displayName: "Upgrade Helm deployment"
        inputs:
          ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
            azureSubscription: "${{ variables.nprdServiceConnection }}"
          ${{ if eq(variables['Build.SourceBranchName'], 'prod') }}:
            azureSubscription: "${{ variables.prodServiceConnection }}"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -xe
            branch="${{ variables['Build.SourceBranchName'] }}"
            build="$(Build.BuildNumber)"

            if [ "$branch" = "dev" ]
            then
                azEnv="${{ variables.devAzEnv }}"
                resourceGroup="${{ variables.devResourceGroup }}"
                cluster="${{ variables.devCluster }}"
            elif [ "$branch" = "prod" ]
            then
                azEnv="${{ variables.prodAzenv }}"
                resourceGroup="${{ variables.prodResourceGroup }}"
                cluster="${{ variables.prodCluster }}"
            else
                azEnv="-"
                resourceGroup="-"
                cluster="-"
            fi

            context=${cluster}-admin
            echo $azEnv, $resourceGroup, $cluster, $context

            export KUBECONFIG=~/.kube/config
            rm $KUBECONFIG ||true

            az aks get-credentials \
                --name $cluster \
                --resource-group $resourceGroup \
                --overwrite-existing \
                --file $KUBECONFIG \
                --context $context
            
            # Pass kubeconfig to kubelogin to access k8s API
            kubelogin convert-kubeconfig -l azurecli

            helm upgrade --install ${{ variables.serviceName }}-$azEnv \
                ./chart \
                --values ./chart/values-$azEnv.yaml \
                --set image.tag=${branch}-$(buildHash) \
                --namespace ${{ variables.namespace }} \
                --wait --debug
      - task: AzureCLI@2
        displayName: Delete image from ACR
        inputs:
          azureSubscription: "${{ variables.nprdServiceConnection }}"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            env_prefix="$(Build.SourceBranchName)-"
            current_tag="$(Build.SourceBranchName)-$(buildHash)"
            echo "Deleting all images in $(acrName)/$(imageName) with prefix: $env_prefix"
            echo "Keeping current image tag: $current_tag"

            tags=$(az acr repository show-tags \
              --name $(acrName) \
              --repository $(imageName) \
              --output tsv || true)

            if [ -z "${tags:-}" ]; then
              echo "No tags found in repository $(imageName). Nothing to delete."
              exit 0
            fi

            matched_tags=$(echo "$tags" | grep -E "^${env_prefix}" || true)

            if [ -z "${matched_tags:-}" ]; then
              echo "No tags found for environment prefix $env_prefix. Nothing to delete."
              exit 0
            fi

            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              if [ "$tag" = "$current_tag" ]; then
                echo "Skipping current image: $(imageName):$tag"
                continue
              fi
              echo "Deleting image: $(imageName):$tag"
              az acr repository delete --name $(acrName) --image $(imageName):$tag --yes
            done <<< "$matched_tags"

